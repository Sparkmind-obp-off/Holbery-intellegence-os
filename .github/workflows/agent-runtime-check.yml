name: HIO Agent Runtime Checks

on:
  push:
    branches:
      - feat/agent-runtime-v1
      - fix/agent-workspace-csp-assets
      - feat/hio-coding-agent-v1
      - feat/hio-agent-validation-loop-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hio-agent-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run typecheck, lint, format, tests, and build
        run: npm run check
      - name: Run founder workflow regression tests
        run: npm run test:founder
      - name: Run end-to-end regression tests
        run: npm run test:e2e
      - name: Scan source and build output for secret leakage
        run: npm run security:check
