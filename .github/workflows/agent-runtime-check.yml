name: HIO Agent Runtime Checks

on:
  push:
    branches:
      - feat/agent-runtime-v1
      - fix/agent-workspace-csp-assets
      - feat/hio-coding-agent-v1
      - feat/hio-agent-validation-loop-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: hio-agent-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Temporary format export for reviewed source files
        run: npx prettier --write src/agent-workspace.ts src/coding-agent.ts tests/agent-workspace.test.ts public/static/agent.js
      - name: Commit formatter fixes on the owned feature branch
        if: github.event_name == 'pull_request' && github.repository == 'Sparkmind-obp-off/Holbery-intellegence-os' && github.head_ref == 'feat/hio-agent-validation-loop-v1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent-workspace.ts src/coding-agent.ts tests/agent-workspace.test.ts public/static/agent.js
          if ! git diff --cached --quiet; then
            git commit -m "style(agent): apply repository formatter"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Export formatted source for review
        uses: actions/upload-artifact@v4
        with:
          name: hio-agent-formatted-source
          path: |
            src/agent-workspace.ts
            src/coding-agent.ts
            tests/agent-workspace.test.ts
            public/static/agent.js
      - name: Run typecheck, lint, format, tests, and build
        run: npm run check
      - name: Scan source and build output for secret leakage
        run: npm run security:check
